server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header X-Content-Type-Options nosniff always;
    location /v1/ {
        proxy_pass http://engine-server:8787;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 310s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /healthz {
        proxy_pass http://engine-server:8787;
        proxy_set_header Host $host;
    }
    location /engines/ { try_files $uri =404; }
    location /sources/ { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location ~ \.wasm$ { types { application/wasm wasm; } try_files $uri =404; }
    location = /sw.js { try_files $uri =404; expires -1; }
    location = /index.html { try_files $uri =404; expires -1; }
    location / { try_files $uri $uri/ /index.html; }
}
