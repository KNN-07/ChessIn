services:
  engine-server:
    build:
      context: .
      dockerfile: apps/engine-server/Dockerfile
    environment:
      CHESSIN_API_TOKEN: ${CHESSIN_API_TOKEN:?Set CHESSIN_API_TOKEN to a random secret of at least 32 characters}
      CHESSIN_HOST: 0.0.0.0
      CHESSIN_ALLOWED_ORIGINS: ${CHESSIN_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      CHESSIN_MAX_CONCURRENT: 2
      CHESSIN_MAX_JOB_MS: 300000
      CHESSIN_MAX_THREADS: 4
      CHESSIN_MAX_HASH_MB: 256
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 4
    pids_limit: 128
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      engine-server:
        condition: service_healthy
